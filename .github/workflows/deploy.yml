# 깃허브 페이지 자동 배포
#
# main 브랜치에 푸시할 때마다 깃허브가 npm test 로 학습지 정답 대조를 돌리고
# npm run build 로 dist/index.html (한 파일로 묶인 결과물) 을 만들어 Pages 에 올린다.
# 이렇게 하면 저장소에 dist/ 를 커밋하지 않아도 된다.
#
# configure-pages 의 enablement: true 덕분에 Pages 설정을 손으로 켤 필요가 없다.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 저장소 Actions 탭에서 손으로 실행할 수도 있다

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 자체 점검 (학습지 정답 98가지 대조)
        run: npm test

      - name: 빌드
        run: npm run build

      # Pages 가 아직 꺼져 있으면 여기서 켜 준다
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
